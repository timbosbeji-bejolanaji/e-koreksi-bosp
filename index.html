<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Koreksi BOSP 2026 | Kecamatan Beji</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --navy-900: #0f172a;
      --accent-blue: #2563eb;
      --surface-bg: #f8fafc;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    body { background-color: var(--surface-bg); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; }
    .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top right, #1e3a8a 0%, #0f172a 60%, #020617 100%); padding: 24px; }
    .login-card { max-width: 440px; width: 100%; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: #fff; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.45); padding: 36px 32px; }
    .brand-icon-box { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #fff; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); }
    .nav-pills-custom { background-color: #f1f5f9; padding: 4px; border-radius: 12px; }
    .nav-pills-custom .nav-link { border-radius: 9px; color: var(--text-muted); font-weight: 600; font-size: 0.875rem; }
    .nav-pills-custom .nav-link.active { background-color: #fff; color: var(--accent-blue); box-shadow: 0 2px 6px rgba(15,23,42,0.08); }
    .navbar-elegant { background-color: var(--navy-900); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 0.75rem 0; }
    .navbar-elegant .nav-link { color: #cbd5e1; font-weight: 500; font-size: 0.9rem; padding: 0.5rem 1rem !important; border-radius: 10px; margin: 0 2px; }
    .navbar-elegant .nav-link:hover { color: #fff; background-color: rgba(255,255,255,0.08); }
    .navbar-elegant .nav-link.active { color: #fff; background-color: var(--accent-blue); font-weight: 600; }
    .card-elegant { background: #fff; border: 1px solid var(--card-border); border-radius: 16px; box-shadow: 0 1px 3px rgba(15,23,42,0.03); }
    .card-elegant .card-header { background: transparent; border-bottom: 1px solid #f1f5f9; padding: 1rem 1.25rem; font-weight: 700; font-size: 0.95rem; color: var(--navy-900); }
    .month-tile { border-radius: 12px; padding: 12px 10px; text-align: center; cursor: pointer; transition: transform 0.15s ease; }
    .month-tile:hover { transform: translateY(-2px); }
    .status-box-green { background-color: #ecfdf5 !important; color: #065f46 !important; border: 1px solid #a7f3d0 !important; }
    .status-box-red { background-color: #fef2f2 !important; color: #991b1b !important; border: 1px solid #fecaca !important; }
    .cell-green { background-color: #10b981 !important; color: #fff !important; font-weight: 600; text-align: center; cursor: pointer; }
    .cell-red { background-color: #ef4444 !important; color: #fff !important; font-weight: 600; text-align: center; cursor: pointer; }
    .form-control, .form-select { border-radius: 10px; border-color: #cbd5e1; font-size: 0.9rem; }
    .table-input-sm input { font-size: 0.84rem; padding: 0.35rem 0.55rem; border-radius: 7px; }
    .paper-choice { border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px; cursor: pointer; }
    .paper-choice.selected { border-color: var(--accent-blue); background-color: #eff6ff; }
    .loading-overlay { position: fixed; inset: 0; background: rgba(248,250,252,0.85); backdrop-filter: blur(4px); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; }
  </style>
</head>
<body>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner-border text-primary" style="width: 2.8rem; height: 2.8rem;" role="status"></div>
    <div class="mt-3 fw-semibold text-dark" id="loadingText">Menghubungkan ke server...</div>
  </div>

  <!-- HALAMAN LOGIN -->
  <div id="loginSection" class="login-wrapper">
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="brand-icon-box mb-3"><i class="bi bi-journal-bookmark-fill fs-3"></i></div>
        <h5 class="fw-bold text-dark mb-1">E-Koreksi BOSP 2026</h5>
        <p class="text-muted small mb-0">Korwil Kecamatan Beji &bull; Dinas Pendidikan Kab. Pasuruan</p>
      </div>

      <ul class="nav nav-pills nav-fill nav-pills-custom mb-4" id="loginTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tab-lembaga" data-bs-toggle="pill" data-bs-target="#pane-lembaga" type="button"><i class="bi bi-building me-1"></i> Lembaga</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-timbos" data-bs-toggle="pill" data-bs-target="#pane-timbos" type="button"><i class="bi bi-shield-check me-1"></i> Tim BOS</button>
        </li>
      </ul>

      <div id="loginAlert" class="alert alert-danger py-2 small rounded-3 d-none"></div>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="pane-lembaga">
          <form onsubmit="handleLogin(event, 'LEMBAGA')">
            <div class="mb-3">
              <label class="form-label fw-semibold small text-secondary">Pilih Nama Lembaga</label>
              <select id="selectSchool" class="form-select py-2" required>
                <option value="">-- Memuat daftar sekolah... --</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold small text-secondary">Password (NPSN)</label>
              <input type="password" id="passLembaga" class="form-control py-2" placeholder="Masukkan 8 digit NPSN" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">Masuk ke Portal Lembaga <i class="bi bi-arrow-right ms-1"></i></button>
          </form>
        </div>

        <div class="tab-pane fade" id="pane-timbos">
          <form onsubmit="handleLogin(event, 'TIMBOS')">
            <div class="mb-3">
              <label class="form-label fw-semibold small text-secondary">Username</label>
              <input type="text" id="userTimbos" class="form-control py-2
